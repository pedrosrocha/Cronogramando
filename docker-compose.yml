services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PDF_SERVICE_URL: http://pdf-service:8001
      SEARXNG_URL: ${SEARXNG_URL:-http://host.docker.internal:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - pdf-service

  pdf-service:
    build: ./pdf-service
    restart: unless-stopped
    environment:
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-67108864}
      PDF_TABLE_DETECTION: ${PDF_TABLE_DETECTION:-auto}
      PDF_TABLE_FINDER_MAX_PAGES: ${PDF_TABLE_FINDER_MAX_PAGES:-20}
    ports:
      - "8001:8001"

volumes:
  postgres-data:
